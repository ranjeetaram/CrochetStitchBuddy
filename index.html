<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stitch Buddy — Learn to Crochet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF6FF;
    --panel:#FFFFFF;
    --coral:#FF6F59;
    --coral-dark:#E85A44;
    --sun:#FFC145;
    --mint:#3DBFAE;
    --mint-dark:#2A9D8F;
    --grape:#8E5FBF;
    --navy:#1E3A5F;
    --navy-light:#587396;
    --line:#D7E8F5;
    --radius:22px;
    --shadow: 0 8px 20px rgba(30,58,95,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,193,69,0.20), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(142,95,191,0.16), transparent 45%),
      var(--bg);
    font-family:'Nunito', sans-serif;
    color:var(--navy);
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', sans-serif; }
  button{ font-family:'Nunito', sans-serif; cursor:pointer; }
  .app{ max-width:920px; margin:0 auto; padding:18px 18px 90px; }

  /* NAV */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand h1{ font-size:22px; margin:0; color:var(--navy); }
  .brand small{ display:block; font-size:12px; color:var(--navy-light); font-weight:700; letter-spacing:.03em;}
  nav.tabs{ display:flex; gap:6px; background:var(--panel); padding:6px; border-radius:999px; box-shadow:var(--shadow); flex-wrap:wrap;}
  nav.tabs button{
    border:none; background:transparent; padding:9px 16px; border-radius:999px; font-weight:800; font-size:14px; color:var(--navy-light);
    transition:.15s;
  }
  nav.tabs button.active{ background:var(--coral); color:white; }
  .parent-link{ border:2px solid var(--grape); background:white; color:var(--grape); font-weight:800; padding:9px 14px; border-radius:999px; font-size:13px;}

  /* MASCOT */
  .mascot{ flex-shrink:0; }
  .bubble{
    background:white; border-radius:16px; padding:10px 14px; box-shadow:var(--shadow); font-weight:700; font-size:14px; position:relative; max-width:260px;
  }

  /* CARD */
  .card{ background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-bottom:18px; }

  /* HOME */
  .hero{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .hero .ring-wrap{ position:relative; width:130px; height:130px; flex-shrink:0;}
  .hero h2{ font-size:26px; margin:0 0 6px; }
  .hero p{ margin:0 0 14px; color:var(--navy-light); font-weight:600; }
  .cta{ background:var(--coral); color:white; border:none; padding:14px 24px; border-radius:999px; font-weight:800; font-size:16px; box-shadow:0 6px 14px rgba(255,111,89,.35); }
  .cta:hover{ background:var(--coral-dark); }
  .cta.secondary{ background:var(--mint); box-shadow:0 6px 14px rgba(61,191,174,.3);}
  .cta.secondary:hover{ background:var(--mint-dark); }

  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px;}
  @media(max-width:640px){ .grid3{ grid-template-columns:1fr 1fr; } }
  .stat{ background:#F5FAFF; border-radius:16px; padding:14px; text-align:center; }
  .stat .num{ font-family:'Baloo 2'; font-size:26px; color:var(--coral); }
  .stat .lab{ font-size:12px; font-weight:800; color:var(--navy-light); text-transform:uppercase; letter-spacing:.03em;}

  /* MATERIALS */
  .mat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .mat-card{ border:2px solid var(--line); border-radius:18px; padding:16px; background:#FCFEFF; transition:.15s; }
  .mat-card.checked{ border-color:var(--mint); background:#EFFBF9; }
  .mat-card .emoji{ font-size:34px; }
  .mat-card h3{ font-size:16px; margin:8px 0 4px; }
  .mat-card p{ font-size:13px; color:var(--navy-light); margin:0 0 10px; font-weight:600;}
  .check-row{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; color:var(--mint-dark); }
  .check-row input{ width:18px; height:18px; accent-color:var(--mint); }

  /* GLOSSARY */
  .search{ width:100%; padding:12px 16px; border-radius:999px; border:2px solid var(--line); font-size:15px; font-weight:700; margin-bottom:16px; outline:none;}
  .search:focus{ border-color:var(--coral); }
  .gloss-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .gloss-card{ perspective:1000px; height:120px; }
  .gloss-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .gloss-card.flipped .gloss-inner{ transform:rotateY(180deg); }
  .gloss-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; padding:14px; display:flex; flex-direction:column; justify-content:center; }
  .gloss-front{ background:linear-gradient(135deg,var(--sun),#FFD97A); }
  .gloss-front b{ font-family:'Baloo 2'; font-size:17px; }
  .gloss-front span{ font-size:12px; font-weight:700; opacity:.8; }
  .gloss-back{ background:var(--navy); color:white; transform:rotateY(180deg); font-size:13px; font-weight:700; line-height:1.4;}

  /* STEPS PATH */
  .path-wrap{ position:relative; padding:10px 0 20px; }
  .step-row{ display:flex; align-items:center; gap:16px; position:relative; padding:10px 0; }
  .step-row:not(:last-child)::after{
    content:''; position:absolute; left:33px; top:66px; bottom:-14px; width:4px;
    background:repeating-linear-gradient(to bottom, var(--coral) 0 8px, transparent 8px 16px);
    border-radius:4px;
  }
  .tile{
    width:66px; height:66px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2'; font-size:22px; font-weight:700; border:none; color:white; box-shadow:var(--shadow); position:relative; z-index:2;
  }
  .tile.locked{ background:#C9D8E5; color:#8FA3B8; }
  .tile.todo{ background:var(--sun); color:var(--navy); }
  .tile.progress{ background:var(--coral); }
  .tile.done{ background:var(--mint); }
  .tile.stuck-flag::before{
    content:'❗'; position:absolute; top:-6px; right:-6px; background:white; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:var(--shadow);
  }
  .step-thumb{ width:56px; height:56px; border-radius:14px; flex-shrink:0; overflow:hidden; box-shadow:inset 0 0 0 2px rgba(255,255,255,.6); }
  .step-thumb svg{ display:block; width:100%; height:100%; }
  .step-row-content{ display:flex; align-items:center; gap:12px; flex:1; }
  .modal-art{ width:100%; max-width:220px; margin:0 auto; display:block; border-radius:20px; overflow:hidden; }
  .modal-art svg{ display:block; width:100%; height:auto; }
  .video-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:16px; overflow:hidden; margin:14px 0; box-shadow:var(--shadow); background:#000; }
  .video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-label{ font-size:12px; font-weight:800; color:var(--navy-light); text-transform:uppercase; letter-spacing:.03em; margin:14px 0 -6px; display:flex; align-items:center; gap:6px;}
  .step-info{ flex:1; background:var(--panel); border-radius:18px; padding:14px 18px; box-shadow:var(--shadow); cursor:pointer; transition:.15s; border:2px solid transparent;}
  .step-info:hover{ border-color:var(--coral); }
  .step-info.locked{ cursor:not-allowed; opacity:.6; }
  .step-info h3{ margin:0 0 3px; font-size:16px; }
  .step-info p{ margin:0; font-size:13px; color:var(--navy-light); font-weight:700;}
  .badge-pill{ font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; }
  .badge-pill.done{ background:#DFF7F2; color:var(--mint-dark); }
  .badge-pill.progress{ background:#FFE6E1; color:var(--coral-dark); }
  .badge-pill.todo{ background:#FFF3D9; color:#9A6B00; }

  /* MODAL */
  .overlay{ position:fixed; inset:0; background:rgba(30,58,95,0.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ background:var(--panel); border-radius:26px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:26px; position:relative; }
  .modal .close{ position:absolute; top:16px; right:16px; background:#F1F5F9; border:none; width:34px; height:34px; border-radius:50%; font-size:16px; font-weight:800; color:var(--navy-light); }
  .modal h2{ margin:0 0 4px; font-size:22px; }
  .step-num-badge{ display:inline-block; background:var(--coral); color:white; font-family:'Baloo 2'; font-size:13px; padding:3px 12px; border-radius:999px; margin-bottom:10px; }
  .modal .instr{ background:#F5FAFF; border-radius:16px; padding:14px; font-weight:700; font-size:15px; line-height:1.5; margin:14px 0; }
  .tip{ background:#FFF7E6; border-left:4px solid var(--sun); border-radius:8px; padding:10px 14px; font-size:13px; font-weight:700; color:#8A6300; margin-bottom:14px;}
  .modal-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .btn{ border:none; border-radius:999px; padding:12px 18px; font-weight:800; font-size:14px; flex:1; min-width:140px; }
  .btn.stuck{ background:#FFE6E1; color:var(--coral-dark); }
  .btn.ai{ background:var(--grape); color:white; }
  .btn.complete{ background:var(--mint); color:white; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .ai-box{ background:#F4EEFB; border-radius:14px; padding:14px; margin-top:14px; font-size:14px; font-weight:700; color:#4B2E75; line-height:1.5; min-height:40px; }

  /* PARENT AREA */
  .pin-box{ max-width:280px; margin:40px auto; text-align:center; }
  .pin-input{ width:100%; text-align:center; font-size:26px; letter-spacing:10px; padding:12px; border-radius:14px; border:2px solid var(--line); font-weight:800; margin:14px 0; }
  table.metrics{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  table.metrics th{ text-align:left; padding:10px 8px; color:var(--navy-light); font-size:11px; text-transform:uppercase; letter-spacing:.03em; border-bottom:2px solid var(--line);}
  table.metrics td{ padding:10px 8px; border-bottom:1px solid var(--line); font-weight:700;}
  tr.alert-row{ background:#FFF1EF; }
  .alert-msg{ background:#FFF1EF; border-left:4px solid var(--coral); border-radius:8px; padding:12px 16px; font-weight:700; font-size:13px; color:var(--coral-dark); margin-bottom:14px;}
  .reset-btn{ background:#F1F5F9; color:var(--navy-light); border:none; padding:10px 16px; border-radius:999px; font-weight:800; font-size:13px; margin-top:20px;}

  .badges-earned{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .badge-chip{ background:linear-gradient(135deg,var(--sun),#FFD97A); border-radius:14px; padding:10px 14px; font-weight:800; font-size:13px; display:flex; align-items:center; gap:6px;}

  /* GALLERY */
  .gallery-intro{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .gallery-intro .mascot-sm{ width:54px; flex-shrink:0; }
  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; margin-top:16px; }
  .make-card{ background:#FCFEFF; border-radius:20px; overflow:hidden; box-shadow:var(--shadow); border:2px solid var(--line); transition:.15s; }
  .make-card:hover{ transform:translateY(-3px); border-color:var(--coral); }
  .make-card img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .make-card .make-body{ padding:12px 14px 14px; }
  .make-card h3{ font-size:14.5px; margin:0 0 4px; line-height:1.25; }
  .make-card p{ font-size:12px; color:var(--navy-light); font-weight:700; margin:0; line-height:1.4;}
  .maker-tag{ display:inline-block; background:#FFE6E1; color:var(--coral-dark); font-size:10.5px; font-weight:800; padding:2px 9px; border-radius:999px; margin-top:8px; text-transform:uppercase; letter-spacing:.02em;}
</style>
</head>

<script>
/* ---------------- DATA ---------------- */
const MATERIALS = [
  {id:'hook', emoji:'🪝', name:'Crochet Hook', desc:'Size H/8 (5mm) is perfect for beginners — easy to grip.'},
  {id:'yarn', emoji:'🧶', name:'Yarn', desc:'Worsted weight (#4), light color so you can see your stitches.'},
  {id:'scissors', emoji:'✂️', name:'Scissors', desc:'Small, sharp scissors just for cutting yarn.'},
  {id:'needle', emoji:'🪡', name:'Tapestry Needle', desc:'A big blunt needle for weaving in loose ends.'},
  {id:'markers', emoji:'📌', name:'Stitch Markers', desc:'Optional — little clips to mark your place.'},
  {id:'space', emoji:'🛋️', name:'Comfy Space', desc:'Good light and a comfy seat make learning easier!'},
];

const GLOSSARY = [
  {term:'Hook', def:'The tool with a little curved hook on the end you use to grab and pull yarn.'},
  {term:'Yarn', def:'The soft string (usually cotton or acrylic) you crochet with.'},
  {term:'Slip Knot', def:'A special loop that slides tight — the very first knot you put on your hook.'},
  {term:'Chain (ch)', def:'A row of loops that forms the base of most crochet projects.'},
  {term:'Yarn Over (yo)', def:'Wrapping the yarn over your hook before pulling it through a loop.'},
  {term:'Single Crochet (sc)', def:'The most basic stitch — short and sturdy, great for beginners.'},
  {term:'Stitch', def:'One single loop-and-pull movement that builds your fabric.'},
  {term:'Row', def:'One line of stitches going across your work.'},
  {term:'Turn', def:'Flipping your work around so you can crochet back the other way.'},
  {term:'Tension', def:'How tight or loose you hold the yarn — even tension makes neat stitches.'},
  {term:'Gauge', def:'How many stitches fit in one inch — helps your project come out the right size.'},
  {term:'Fasten Off', def:'Finishing your work by cutting the yarn and pulling it through the last loop.'},
  {term:'Weave In', def:'Hiding loose yarn ends inside your stitches with a tapestry needle.'},
  {term:'Frog / Frogging', def:'Ripping out stitches to fix a mistake — "rip it, rip it!"'},
  {term:'Skein', def:'A wound-up bundle of yarn, ready to use.'},
];

const STEPS = [
  {id:1, title:'Make a Slip Knot', short:'Tie your very first loop.',
   instr:'Make a loop with your yarn, then pull a second loop through it. Slide it onto your hook and gently pull the tail so it hugs the hook snugly — not too tight!',
   tip:'Leave a tail about as long as your hand — you\'ll need it later!'},
  {id:2, title:'Hold Your Hook & Yarn', short:'Find a comfy grip.',
   instr:'Hold the hook like a pencil (or like a spoon — try both!). Drape the yarn over your pointer finger on your other hand so it can flow smoothly.',
   tip:'There\'s no wrong way to hold it — find what feels comfy for YOUR hands.'},
  {id:3, title:'Chain Stitch', short:'Build a chain of 15.',
   instr:'Yarn over, then pull the yarn through the loop on your hook. That\'s one chain! Repeat until you have 15 chains in a row.',
   tip:'Count as you go: 1, 2, 3... it helps to say it out loud!'},
  {id:4, title:'First Single Crochet', short:'Start your first real stitch.',
   instr:'Skip the first chain. Push your hook into the second chain from the hook, yarn over, and pull through — you\'ll have 2 loops on your hook. Yarn over again and pull through both loops.',
   tip:'That "2 loops" moment is the tricky part — go slow!'},
  {id:5, title:'Single Crochet Across', short:'Repeat all the way down.',
   instr:'Keep doing that same single crochet stitch into each chain across the row until you reach the end.',
   tip:'Every stitch uses the same 3 moves — insert, yarn over, pull through twice.'},
  {id:6, title:'Turn & Chain 1', short:'Get ready for the next row.',
   instr:'When you reach the end of a row, turn your work around like a page in a book, then chain 1 before starting the next row.',
   tip:'Turning is what lets you crochet back and forth to build a square.'},
  {id:7, title:'Build Your Square', short:'Repeat rows until it\'s square-shaped.',
   instr:'Single crochet across each row, turning and chaining 1 between rows, until your piece is as tall as it is wide — like a little coaster!',
   tip:'Hold it up and check the shape every few rows.'},
  {id:8, title:'Fasten Off & Weave In', short:'Finish it like a pro!',
   instr:'Cut the yarn (leaving a tail), pull it all the way through your last loop to lock it, then use your tapestry needle to weave both tails into the fabric.',
   tip:'You did it — that\'s a real, finished crochet piece!'},
];

  6: {id:'UtlhsREo7mg', label:'Watch: turning & the turning chain'},
  8: {id:'8tSUnkXvStY', label:'Watch: fasten off & weave in ends'},

const STEP_ART = {

const PARENT_PIN_DEFAULT = '1234';
const STUCK_ALERT_THRESHOLD = 3; // attempts or stuck-taps that trigger a parent alert

/* ---------------- STATE / STORAGE ---------------- */
let state = {
  view:'home',
  kidName:'Friend',
  materialsChecked:{},
  glossaryFlipped:{},
  steps:{}, // id -> {status, attempts, stuckTaps, hintCount, timeSpentSec, openedAt}
  badges:[],
  parentUnlocked:false,
  activeStepId:null,
  hintText:'',
};

function defaultStepState(){ return {status:'locked', attempts:0, stuckTaps:0, hintCount:0, timeSpentSec:0, openedAt:null}; }

function loadProgress(){
  try{
    const raw = localStorage.getItem('stitchBuddyProgress');
    if(raw){
      const saved = JSON.parse(raw);
      state = {...state, ...saved, view:'home', activeStepId:null, hintText:''};
    } else {
      initSteps();
    }
  }catch(e){
    initSteps();
  }
  // make sure every step has a record, and step 1 is unlocked
  STEPS.forEach(st=>{ if(!state.steps[st.id]) state.steps[st.id] = defaultStepState(); });
  if(state.steps[1].status==='locked') state.steps[1].status='todo';
  render();
}

function initSteps(){
  STEPS.forEach((s,i)=>{
    state.steps[s.id] = defaultStepState();
    if(i===0) state.steps[s.id].status='todo';
  });
}

function saveProgress(){
  try{
    localStorage.setItem('stitchBuddyProgress', JSON.stringify({
      kidName:state.kidName, materialsChecked:state.materialsChecked, glossaryFlipped:state.glossaryFlipped,
      steps:state.steps, badges:state.badges
    }));
  }catch(e){ console.error('save failed', e); }
}

/* ---------------- HELPERS ---------------- */
function completedCount(){ return Object.values(state.steps).filter(s=>s.status==='done').length; }
function pct(){ return Math.round((completedCount()/STEPS.length)*100); }
function fmtTime(sec){ if(!sec) return '0m'; const m=Math.round(sec/60); return m<1? '<1m' : m+'m'; }

function unlockNext(id){
  const idx = STEPS.findIndex(s=>s.id===id);
  if(idx>=0 && idx+1<STEPS.length){
    const nextId = STEPS[idx+1].id;
    if(!state.steps[nextId]) state.steps[nextId]=defaultStepState();
    if(state.steps[nextId].status==='locked') state.steps[nextId].status='todo';
  }
}

function openStep(id){
  const st = state.steps[id];
  if(!st || st.status==='locked') return;
  st.openedAt = Date.now();
  if(st.status==='todo') st.status='progress';
  state.activeStepId = id;
  state.hintText='';
  saveProgress(); render();
}

function closeStep(){
  logTimeSpent();
  state.activeStepId=null; render();
}

function logTimeSpent(){
  const id = state.activeStepId;
  if(!id) return;
  const st = state.steps[id];
  if(st && st.openedAt){
    st.timeSpentSec += Math.round((Date.now()-st.openedAt)/1000);
    st.openedAt = null;
  }
}

function markStuck(){
  const st = state.steps[state.activeStepId];
  st.stuckTaps += 1;
  saveProgress(); render();
}

function markComplete(){
  logTimeSpent();
  const id = state.activeStepId;
  const st = state.steps[id];
  st.status='done'; st.attempts += 1;
  unlockNext(id);
  if(completedCount()===STEPS.length && !state.badges.includes('Coaster Creator')){
    state.badges.push('Coaster Creator');
  }
  if(completedCount()===1 && !state.badges.includes('First Stitch')){
    state.badges.push('First Stitch');
  }
  saveProgress();
  state.activeStepId=null;
  render();
}

const HINTS = {
  1:["Make a loop like a pretzel, then reach through it and pull up a second loop. Slide that onto your hook!","If it keeps coming undone, pull the long yarn end gently to snug the loop around your hook.","Try again slowly. Every crocheter's first slip knot is a little wobbly, and yours will get neater!"],
  2:["Try holding the hook like a pencil. If that feels awkward, hold it like a spoon instead!","Let the yarn slide over your pointer finger. Your other fingers can gently pinch your work to keep it steady.","If your hand gets tired, shake it out and take a break. Comfy hands crochet best."],
  3:["Each chain is two moves: wrap the yarn over the hook, then pull it through the loop on your hook.","Keep your loops loose enough that the hook can slide in later. Think of them as relaxed, not squeezed.","Count out loud as you go, and slide a stitch marker or clip on every 5th chain so you don't lose count."],
  4:["Skip the chain closest to your hook, then push the hook into the next chain. That's your starting spot!","After you pull up a loop you should see 2 loops on your hook. That's exactly right! Now yarn over and pull through both.","Go slow and say it to yourself: in, wrap, pull up, wrap, pull through both."],
  5:["Every stitch is the same three moves, so you're just repeating what you already did. Keep going!","Count your stitches at the end of the row. You should have the same number you started with.","If a stitch looks messy, don't worry. Even rows come with practice."],
  6:["When you reach the end, flip your work over like turning a page in a book, then make 1 chain.","That one chain helps lift your yarn up to the new row, so it's like a tiny elevator!","Make sure you start your first stitch in the stitch right next to your chain, not in the chain itself."],
  7:["Hold your piece up and compare its width to its height. When they match, you have a square!","Keep counting stitches every few rows so your edges stay straight.","Feeling wobbly? That's totally normal. Squares with a bit of character are the best kind."],
  8:["Cut the yarn, leaving a tail about as long as your hand. Then pull the tail all the way through your last loop to lock it.","Thread the tail onto your tapestry needle and weave it back and forth through a few stitches.","Do the same with the other tail from the very start. Then give your creation a squeeze. You made it!"],
};

function showHint(){
  const id = state.activeStepId;
  const st = state.steps[id];
  const list = HINTS[id] || ["Take a deep breath, go slowly, and try that one move again. You've got this!"];
  state.hintText = list[st.hintCount % list.length];
  st.hintCount += 1;
  st.attempts += 1;
  saveProgress();
  render();
}

function toggleMaterial(id){
  state.materialsChecked[id] = !state.materialsChecked[id];
  saveProgress(); render();
}
function toggleGlossary(term){
  state.glossaryFlipped[term] = !state.glossaryFlipped[term];
  render();
}

function mascotSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="#FF6F59"/>
    <path d="M12 50 Q50 20 88 50 Q50 80 12 50" fill="none" stroke="#E85A44" stroke-width="3" opacity="0.5"/>
    <path d="M50 4 Q80 50 50 96 Q20 50 50 4" fill="none" stroke="#E85A44" stroke-width="3" opacity="0.5"/>
    <circle cx="36" cy="46" r="6" fill="white"/><circle cx="64" cy="46" r="6" fill="white"/>
    <circle cx="37" cy="47" r="3" fill="#1E3A5F"/><circle cx="65" cy="47" r="3" fill="#1E3A5F"/>
    <path d="M35 64 Q50 76 65 64" stroke="#1E3A5F" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function ringSvg(percent){
  const r=52, c=2*Math.PI*r, off = c - (percent/100)*c;
  return `<svg width="130" height="130" viewBox="0 0 130 130">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="#E7F1FA" stroke-width="12"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="#3DBFAE" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
    <text x="65" y="60" text-anchor="middle" font-family="Baloo 2" font-size="26" fill="#1E3A5F" font-weight="700">${percent}%</text>
    <text x="65" y="80" text-anchor="middle" font-family="Nunito" font-size="11" fill="#587396" font-weight="800">DONE</text>
  </svg>`;
}

    </div>
    <nav class="tabs">
      ${tabs.map(([id,label])=>`<button class="${state.view===id?'active':''}" onclick="setView('${id}')">${label}</button>`).join('')}
    </nav>
    <button class="parent-link" onclick="setView('parent')">👪 For Grown-Ups</button>
  </div>`;
}

function homeView(){
  const done = completedCount();
  const totalTime = Object.values(state.steps).reduce((a,s)=>a+s.timeSpentSec,0);
  return `<div class="card hero">
    <div class="ring-wrap">${ringSvg(pct())}</div>
    <div style="flex:1;min-width:220px;">
      <h2>Hi there, future crocheter! 👋</h2>
      <p>You've finished ${done} of ${STEPS.length} stitches on your first project — a cozy little coaster.</p>
      <button class="cta" onclick="setView('steps')">${done===0?'Start My First Stitch':'Keep Stitching'} →</button>
    </div>
  </div>
  <div class="grid3">
    <div class="stat"><div class="num">${done}/${STEPS.length}</div><div class="lab">Steps Done</div></div>
    <div class="stat"><div class="num">${fmtTime(totalTime)}</div><div class="lab">Time Practiced</div></div>
    <div class="stat"><div class="num">${state.badges.length}</div><div class="lab">Badges</div></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Before you start...</h3>
    <p style="color:var(--navy-light);font-weight:700;">Check that you've got your materials ready, and peek at the glossary if a word looks new!</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="cta secondary" onclick="setView('materials')">🧺 Check Materials</button>
      <button class="cta" style="background:var(--grape)" onclick="setView('glossary')">📖 Browse Glossary</button>
    </div>
  </div>
  ${state.badges.length ? `<div class="card"><h3 style="margin-top:0;">Your Badges 🏅</h3>
    <div class="badges-earned">${state.badges.map(b=>`<div class="badge-chip">🏅 ${b}</div>`).join('')}</div></div>` : ''}
  <div class="card">
    <h3 style="margin-top:0;">See What You Could Make Next 🎨</h3>
    <p style="color:var(--navy-light);font-weight:700;margin-top:-6px;">Real projects made by a real kid crocheter — hearts, keychains, granny squares, and more!</p>
    <div class="gallery-grid">
      ${GALLERY.slice(0,4).map(g=>`
        <div class="make-card">
          <img src="${g.data}" alt="${g.title}" loading="lazy"/>
          <div class="make-body"><h3>${g.title}</h3></div>
        </div>`).join('')}
    </div>
    <button class="cta" style="background:var(--grape);margin-top:14px;" onclick="setView('gallery')">See the Full Gallery →</button>
  </div>`;
}

function materialsView(){
  return `<div class="card">
    <h2 style="margin-top:0;">What You'll Need</h2>
    <p style="color:var(--navy-light);font-weight:700;margin-top:-8px;">Tap the box once you've got each item ready!</p>
    <div class="mat-grid">
      ${MATERIALS.map(m=>`
        <div class="mat-card ${state.materialsChecked[m.id]?'checked':''}">
          <div class="emoji">${m.emoji}</div>
          <h3>${m.name}</h3>
          <p>${m.desc}</p>
          <label class="check-row">
            <input type="checkbox" ${state.materialsChecked[m.id]?'checked':''} onchange="toggleMaterial('${m.id}')"/>
            Got it!
          </label>
        </div>`).join('')}
    </div>
  </div>`;
}

function glossaryView(){
  return `<div class="card">
    <h2 style="margin-top:0;">Crochet Words to Know</h2>
    <input class="search" placeholder="🔍 Search a word..." oninput="filterGlossary(this.value)" id="glossSearch"/>
    <div class="gloss-grid" id="glossGrid">
      ${GLOSSARY.map(g=>glossCard(g)).join('')}
    </div>
  </div>`;
}
function glossCard(g){
  return `<div class="gloss-card ${state.glossaryFlipped[g.term]?'flipped':''}" data-term="${g.term.toLowerCase()}" onclick="toggleGlossary('${g.term.replace(/'/g,"\\'")}')">
    <div class="gloss-inner">
      <div class="gloss-face gloss-front"><b>${g.term}</b><span>tap to flip</span></div>
      <div class="gloss-face gloss-back">${g.def}</div>
    </div>
  </div>`;
}
function filterGlossary(q){
  q = q.toLowerCase();
  document.querySelectorAll('#glossGrid .gloss-card').forEach(el=>{
    el.style.display = el.dataset.term.includes(q) ? '' : 'none';
  });
}

function stepsView(){
  return `<div class="card">
    <h2 style="margin-top:0;">Your First Project: A Little Coaster</h2>
    <p style="color:var(--navy-light);font-weight:700;margin-top:-6px;">Follow the yarn trail, one stitch tile at a time.</p>
    <div class="path-wrap">
      ${STEPS.map(s=>stepRow(s)).join('')}
    </div>
  </div>`;
}
function stepRow(s){
  const st = state.steps[s.id] || defaultStepState();
  const tileClass = st.status==='locked'?'locked':st.status==='done'?'done':st.status==='progress'?'progress':'todo';
  const flag = (st.stuckTaps>=STUCK_ALERT_THRESHOLD || st.attempts>=STUCK_ALERT_THRESHOLD) ? 'stuck-flag' : '';
  const icon = st.status==='done' ? '✓' : st.status==='locked' ? '🔒' : s.id;
  const pillClass = st.status==='done'?'done':st.status==='progress'?'progress':'todo';
  const pillText = st.status==='done'?'Done':st.status==='progress'?'In progress':st.status==='locked'?'Locked':'Ready';
  return `<div class="step-row">
    <div class="tile ${tileClass} ${flag}">${icon}</div>
    <div class="step-info ${st.status==='locked'?'locked':''}" onclick="${st.status==='locked'?'':'openStep('+s.id+')'}">
      <div class="step-row-content">
        <div class="step-thumb">${STEP_ART[s.id]}</div>
        <div>
          <h3>${s.title}</h3>
          <p>${s.short}</p>
          <span class="badge-pill ${pillClass}" style="margin-top:6px;display:inline-block;">${pillText}</span>
        </div>
      </div>
    </div>
  </div>`;
}

function stepModal(){
  const id = state.activeStepId;
  if(!id) return '';
  const s = STEPS.find(x=>x.id===id);
  const st = state.steps[id];
  return `<div class="overlay" onclick="if(event.target===this) closeStep()">
    <div class="modal">
      <button class="close" onclick="closeStep()">✕</button>
      <span class="step-num-badge">Stitch ${s.id} of ${STEPS.length}</span>
      <h2>${s.title}</h2>
      <div class="modal-art">${STEP_ART[s.id]}</div>
      <div class="instr">${s.instr}</div>
      <div class="tip">💡 ${s.tip}</div>
      ${STEP_VIDEOS[s.id] ? `
        <div class="video-label">🎬 ${STEP_VIDEOS[s.id].label}</div>
        <div class="video-wrap"><iframe src="https://www.youtube.com/embed/${STEP_VIDEOS[s.id].id}" title="${s.title} tutorial" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      ` : ''}
      ${state.hintText ? `<div class="ai-box">🧶 <b>Loopy says:</b> ${state.hintText}</div>` : ''}
      <div class="modal-actions">
        <button class="btn stuck" onclick="markStuck()">😕 I'm Stuck (${st.stuckTaps})</button>
        <button class="btn ai" onclick="showHint()">🧶 Get a Hint from Loopy</button>
        <button class="btn complete" onclick="markComplete()">✅ Mark Complete</button>
      </div>
    </div>
  </div>`;
}

function parentView(){
  if(!state.parentUnlocked){
    return `<div class="card pin-box">
      <div style="width:60px;margin:0 auto 8px;">${mascotSvg(60)}</div>
      <h2>Grown-Up Area</h2>
      <p style="color:var(--navy-light);font-weight:700;">Enter the 4-digit PIN to view learning progress.</p>
      <input class="pin-input" maxlength="4" inputmode="numeric" id="pinField" placeholder="••••"/>
      <button class="cta" style="width:100%;" onclick="checkPin()">Unlock</button>
      <p style="font-size:12px;color:var(--navy-light);margin-top:10px;">Default PIN is <b>1234</b> (change this in a real deployment).</p>
    </div>`;
  }
  const totalTime = Object.values(state.steps).reduce((a,s)=>a+s.timeSpentSec,0);
  const alerts = STEPS.filter(s=>{
    const st = state.steps[s.id];
    return st && (st.stuckTaps>=STUCK_ALERT_THRESHOLD || st.attempts>=STUCK_ALERT_THRESHOLD) && st.status!=='done';
  });
  return `<div class="card">
    <h2 style="margin-top:0;">Learning Dashboard</h2>
    <p style="color:var(--navy-light);font-weight:700;margin-top:-6px;">See exactly where your child might need extra support.</p>
    <div class="grid3">
      <div class="stat"><div class="num">${completedCount()}/${STEPS.length}</div><div class="lab">Steps Done</div></div>
      <div class="stat"><div class="num">${fmtTime(totalTime)}</div><div class="lab">Total Time</div></div>
      <div class="stat"><div class="num">${alerts.length}</div><div class="lab">Flagged Steps</div></div>
    </div>
    ${alerts.length ? alerts.map(s=>`<div class="alert-msg">🔔 <b>${s.title}</b> looks tricky — ${state.steps[s.id].attempts} attempts and ${state.steps[s.id].stuckTaps} "I'm stuck" taps. Consider a quick check-in with their teacher on this stitch.</div>`).join('') : `<div class="alert-msg" style="border-color:var(--mint);background:#EFFBF9;color:var(--mint-dark);">✅ No flags right now — things are going smoothly!</div>`}
    <table class="metrics">
      <tr><th>Step</th><th>Status</th><th>Attempts</th><th>Stuck taps</th><th>Hints used</th><th>Time</th></tr>
      ${STEPS.map(s=>{
        const st = state.steps[s.id] || defaultStepState();
        const isAlert = (st.stuckTaps>=STUCK_ALERT_THRESHOLD || st.attempts>=STUCK_ALERT_THRESHOLD) && st.status!=='done';
        return `<tr class="${isAlert?'alert-row':''}">
          <td>${s.id}. ${s.title}</td>
          <td>${st.status}</td>
          <td>${st.attempts}</td>
          <td>${st.stuckTaps}</td>
          <td>${st.hintCount}</td>
          <td>${fmtTime(st.timeSpentSec)}</td>
        </tr>`;
      }).join('')}
    </table>
    <button class="reset-btn" onclick="resetProgress()">↺ Reset All Progress</button>
  </div>`;
}
function checkPin(){
  const val = document.getElementById('pinField').value;
  if(val === PARENT_PIN_DEFAULT){ state.parentUnlocked = true; render(); }
  else { alert('That PIN doesn\'t match. Try 1234 for this demo.'); }
}
function resetProgress(){
  if(!confirm('Reset all progress? This cannot be undone.')) return;
  state.materialsChecked = {}; state.glossaryFlipped = {}; state.badges = []; state.steps = {};
  initSteps();
  saveProgress(); render();
}

function setView(v){ state.view=v; render(); }

function galleryView(){
  return `<div class="card">
    <div class="gallery-intro">
      <div class="mascot-sm">${mascotSvg(54)}</div>
      <div>
        <h2 style="margin:0 0 2px;">Gallery of Makes 🎨</h2>
        <p style="color:var(--navy-light);font-weight:700;margin:0;">Real projects made by a real kid crocheter — see what's possible once you finish your coaster!</p>
      </div>
    </div>
    <div class="gallery-grid">
      ${GALLERY.map(g=>`
        <div class="make-card">
          <img src="${g.data}" alt="${g.title}" loading="lazy"/>
          <div class="make-body">
            <h3>${g.title}</h3>
            <p>${g.caption}</p>
            <span class="maker-tag">🧶 Kid-made</span>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function render(){
  const el = document.getElementById('app');
  let body = '';
  if(state.view==='home') body = homeView();
  else if(state.view==='materials') body = materialsView();
  else if(state.view==='glossary') body = glossaryView();
  else if(state.view==='steps') body = stepsView();
  else if(state.view==='gallery') body = galleryView();
  else if(state.view==='parent') body = parentView();
  el.innerHTML = topbar() + body + stepModal();
}

loadProgress();
</script>
</body>
</html>
